services:
  db:
    image: timescale/timescaledb-ha:pg16-all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syrenka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syrenka}
      POSTGRES_DB: ${POSTGRES_DB:-syrenka}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/home/postgres/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  db_data:
