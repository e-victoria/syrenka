services:
  db:
    image: timescale/timescaledb-ha:pg16-all
    environment:
          POSTGRES_USER: ${POSTGRES_USER:-syrenka}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syrenka}
          POSTGRES_DB: ${POSTGRES_DB:-syrenka}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/home/postgres/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
